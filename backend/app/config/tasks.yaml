research_task:
  description: >
    搜索关于"{topic}"的最新信息，包括重要新闻、技术动态和关键数据。
    重要指令：
    1. 进行 1 次全面搜索。
    2. 即使结果包含 Unicode 编码，也直接读取，不要因此重复搜索。
    3. 获取结果后立即输出结构化摘要。
  expected_output: 搜索到的原始信息和资料摘要（含来源链接）

analysis_task:
  description: >
    分析搜索到的"{topic}"相关信息，提供：
    1. 关键趋势分析
    2. 重要事件总结
    3. 技术影响评估
    4. 未来发展预测
  expected_output: 详细的分析报告和关键洞察（结构化）

writing_task:
  description: >
    基于分析结果，写一篇关于"{topic}"的文章：
    1. 标题要吸引人
    2. 内容要有逻辑性
    3. 语言要通俗易懂
    4. 长度 800-1200 字
    5. 包含数据和例子
  expected_output: 完整的技术文章（标题 + 正文）

editing_task:
  description: >
    审校文章，检查：
    1. 事实准确性
    2. 逻辑清晰度
    3. 语言流畅性
    4. 结构合理性
    5. 标题和内容匹配度
    如有问题请明确说明并修改完善；若合格则直接输出定稿。
  expected_output: 最终审校后的高质量文章（标题 + 正文）
