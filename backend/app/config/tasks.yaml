research_task:
  description: >
    搜索关于"{topic}"的最新信息，包括重要新闻、技术动态和关键数据。
    重要指令：
    1. 进行 1 次全面搜索。
    2. 即使结果包含 Unicode 编码，也直接读取，不要因此重复搜索。
    3. 获取结果后立即输出结构化摘要。
  expected_output: 搜索到的原始信息和资料摘要（含来源链接）

analysis_task:
  description: >
    分析搜索到的"{topic}"相关信息，提供：
    1. 关键趋势分析
    2. 重要事件总结
    3. 技术影响评估
    4. 未来发展预测
  expected_output: 详细的分析报告和关键洞察（结构化）

writing_task:
  description: >
    基于分析结果，写一篇关于"{topic}"的文章：
    1. 标题要吸引人
    2. 内容要有逻辑性
    3. 语言要通俗易懂
    4. 长度 800-1200 字
    5. 包含数据和例子

    时间要求（重要）：
    - 写作涉及任何时效性判断（如"最新发版时间""某版本是否已发布""距今多久"等）时，
      必须先调用 get_current_time 工具获取真实当前时间，并以该时间为准，
      不要依据你训练知识中的日期进行猜测或对比。
    - 文中如引用版本发布时间、活动截止时间等，请明确标注其相对当前时间的关系（例如"已于 X 前发布"）。
  expected_output: >
    严格输出以下结构的 JSON（不要包含多余解释或 Markdown 代码块）：
    {
      "title": "文章标题",
      "summary": "文章摘要（100字以内，概括核心观点）",
      "body": "文章正文（含标题以外的全部内容）",
      "keywords": ["关键词1", "关键词2", "关键词3"],
      "confidence": 0.0 到 1.0 之间的浮点数，表示内容可信/完整程度
    }

# 主编审校（由 Flow 的 review 阶段调用，负责门禁决策与出修改意见）
review_task:
  description: >
    你是严谨的主编。请审校下面这篇技术文章，判断其是否达到发布标准。
    若合格，请只回复一个词：PASS。
    若不达标，请先回复 REVISE，然后逐条列出具体、可执行的修改意见
    （如事实错误、逻辑漏洞、结构问题、数据缺失、语言润色点等），
    作者将据此定向重写。

    【待审文章】
    {article}
  expected_output: PASS 或 REVISE + 修改意见
